# Build the web version and publish it on GitHub Pages (static files).
# Repo settings > Pages > Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 7.0.0
      - run: sudo apt-get install -y ninja-build
      - name: Build
        run: |
          emcmake cmake -S . -B build-web -G Ninja
          cmake --build build-web
      - name: Collect site
        run: |
          mkdir site
          cd build-web
          cp index.html index.js index.wasm index.data app.js app.css i18n.js sound.js leveledit.js favicon.svg apple-touch-icon.png ../site/
          cp -r vendor fonts ../site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
