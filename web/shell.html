<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CiberRato Jr</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <section id="left" class="ui">
      <header class="bar">
        <span class="brand">CiberRato <b>Jr</b></span>
        <button id="pick" title="Choose a challenge or level">☰ <span id="pick-name">…</span></button>
        <span class="grow"></span>
        <button id="help" class="ghost" title="API cheat-sheet" aria-pressed="false">API</button>
      </header>
      <div class="bar controls">
        <button id="run" class="primary" title="Run from the start (Ctrl+Enter)">▶ Run</button>
        <button id="reset" title="Put the robot back at the start">↺ Reset</button>
        <span class="grow"></span>
        <span class="seg" id="speed" title="Simulation speed">
          <button data-speed="0.5">×0.5</button><button data-speed="1">×1</button><button data-speed="2">×2</button><button data-speed="4">×4</button>
        </span>
      </div>
      <div id="goal" hidden>
        <div class="goal-head">
          <span id="goal-num" class="title"></span><b id="goal-title"></b>
          <span id="goal-best" class="stars"></span>
          <span class="grow"></span>
          <button id="restore" class="ghost" title="Replace your code with the starter code">↺ Starter code</button>
        </div>
        <div id="goal-text" class="md"></div>
        <details id="hints"><summary>Hints</summary><ol id="hint-list" class="md"></ol></details>
      </div>
      <div id="editor"></div>
      <div id="console-head" class="bar">
        <span class="title">Console</span>
        <span id="state" class="pill">idle</span>
        <span class="grow"></span>
        <button id="clear" class="ghost">Clear</button>
      </div>
      <div id="console" aria-live="polite"></div>
    </section>
    <aside id="cheat" class="ui" hidden>
      <div class="bar"><span class="title">Robot API</span><span class="grow"></span><button id="cheat-close" class="ghost" title="Close">✕</button></div>
      <div id="cheat-body"></div>
    </aside>
    <main id="stage">
      <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
      <div id="status">Loading…</div>
      <div id="result" class="ui" hidden>
        <div class="card">
          <div id="res-stars" class="stars big"></div>
          <h2 id="res-title"></h2>
          <p id="res-text"></p>
          <ul id="res-detail"></ul>
          <div class="row">
            <button id="res-map" class="ghost">☰ Map</button>
            <span class="grow"></span>
            <button id="res-retry">↺ Try again</button>
            <button id="res-next" class="primary">Next ▶</button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <div id="map" class="ui" hidden>
    <div class="sheet">
      <div class="bar"><span class="brand">Challenges</span><span class="grow"></span><button id="map-close" class="ghost" title="Close">✕</button></div>
      <div id="map-body">
        <div id="map-list" class="grid"></div>
        <h3>Free play</h3>
        <div id="map-free" class="grid"></div>
      </div>
      <div class="bar foot">
        <span id="map-total" class="dim"></span>
        <span class="grow"></span>
        <button id="export" class="ghost" title="Save your progress and code to a file">Export progress</button>
        <button id="import" class="ghost" title="Load progress from a file">Import…</button>
        <input id="import-file" type="file" accept=".json,application/json" hidden>
      </div>
    </div>
  </div>
  <script>
    /* Keys typed in the page UI (editor, buttons) must not drive the robot.
       GLFW listens on window in the capture phase, before the event reaches
       the editor, so wrap its key handlers (registered later) with a filter. */
    (function () {
      var add = window.addEventListener;
      window.addEventListener = function (type, fn, opt) {
        if (type === 'keydown' || type === 'keypress') {
          var inner = fn;
          fn = function (e) { if (!(e.target.closest && e.target.closest('.ui'))) return inner.call(this, e); };
        }
        return add.call(this, type, fn, opt);
      };
    })();
    window.addEventListener('keydown', function (e) {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
    });
    var Module = {
      canvas: document.getElementById('canvas'),
      setStatus: function (t) { var el = document.getElementById('status'); el.textContent = t; el.hidden = !t; },
      print: function (t) { console.log(t); },
      printErr: function (t) { console.error(t); }
    };
  </script>
  <script src="vendor/codemirror.js"></script>
  <script src="app.js"></script>
  {{{ SCRIPT }}}
</body>
</html>
