<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CiberRato Academy</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <div id="app">
    <section id="left" class="ui">
      <header class="bar">
        <span class="brand">CiberRato <b>Academy</b></span>
        <button id="pick" data-i18n-title="pick.title">☰ <span id="pick-name">…</span></button>
        <span class="grow"></span>
        <button id="mute" class="ghost" data-i18n-title="mute.title" aria-pressed="false">🔊</button>
        <span class="seg small" id="lang" data-i18n-title="lang.title"><button data-lang="en">EN</button><button data-lang="pt">PT</button></span>
        <button id="help" class="ghost" data-i18n-title="help.title" aria-pressed="false">API</button>
      </header>
      <div class="bar controls">
        <button id="run" class="primary"></button>
        <button id="reset" data-i18n="reset" data-i18n-title="reset.title"></button>
        <span class="grow"></span>
        <span class="seg" id="speed" data-i18n-title="speed.title">
          <button data-speed="0.5">×0.5</button><button data-speed="1">×1</button><button data-speed="2">×2</button><button data-speed="4">×4</button>
        </span>
      </div>
      <div id="goal" hidden>
        <div class="goal-head">
          <span id="goal-num" class="title"></span><b id="goal-title"></b>
          <span id="goal-best" class="stars"></span>
          <span class="grow"></span>
          <button id="restore" class="ghost" data-i18n="restore" data-i18n-title="restore.title"></button>
        </div>
        <div id="goal-text" class="md"></div>
        <details id="hints"><summary data-i18n="hints"></summary><ol id="hint-list" class="md"></ol></details>
      </div>
      <div id="editor"></div>
      <div id="console-head" class="bar">
        <span class="title" data-i18n="console"></span>
        <span id="state" class="pill">idle</span>
        <span class="grow"></span>
        <button id="clear" class="ghost" data-i18n="clear"></button>
      </div>
      <div id="console" aria-live="polite"></div>
    </section>
    <aside id="cheat" class="ui" hidden>
      <div class="bar"><span class="title" data-i18n="api"></span><span class="grow"></span><button id="cheat-close" class="ghost" data-i18n-title="close">✕</button></div>
      <div id="cheat-body"></div>
    </aside>
    <main id="stage">
      <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
      <div id="status" data-i18n="loading"></div>
      <div id="result" class="ui" hidden>
        <div class="card">
          <div id="res-stars" class="stars big"></div>
          <h2 id="res-title"></h2>
          <p id="res-text"></p>
          <ul id="res-detail"></ul>
          <div class="row">
            <button id="res-map" class="ghost" data-i18n="res.map"></button>
            <span class="grow"></span>
            <button id="res-retry" data-i18n="res.retry"></button>
            <button id="res-next" class="primary" data-i18n="res.next"></button>
          </div>
        </div>
      </div>
    </main>
  </div>
  <div id="map" class="ui" hidden>
    <div class="sheet">
      <div class="bar"><span class="brand" data-i18n="map.title"></span><span class="grow"></span><button id="map-close" class="ghost" data-i18n-title="close">✕</button></div>
      <div id="map-body">
        <div id="map-list" class="grid"></div>
        <h3 data-i18n="map.free"></h3>
        <div id="map-free" class="grid"></div>
      </div>
      <div class="bar foot">
        <span id="map-total" class="dim"></span>
        <span class="grow"></span>
        <label id="teacher-box" class="dim" data-i18n-title="teacher.title" hidden><input id="teacher" type="checkbox"> <span data-i18n="teacher"></span></label>
        <button id="load-level" class="ghost" data-i18n="loadlevel" data-i18n-title="loadlevel.title" hidden></button>
        <input id="level-file" type="file" accept=".json,application/json" hidden>
        <button id="export" class="ghost" data-i18n="export" data-i18n-title="export.title"></button>
        <button id="import" class="ghost" data-i18n="import" data-i18n-title="import.title"></button>
        <input id="import-file" type="file" accept=".json,application/json" hidden>
      </div>
    </div>
  </div>
  <script>
    /* Keys typed in the page UI (editor, buttons) must not drive the robot.
       GLFW listens on window in the capture phase, before the event reaches
       the editor, so wrap its key handlers (registered later) with a filter. */
    (function () {
      var add = window.addEventListener;
      window.addEventListener = function (type, fn, opt) {
        if (type === 'keydown' || type === 'keypress') {
          var inner = fn;
          fn = function (e) { if (!(e.target.closest && e.target.closest('.ui'))) return inner.call(this, e); };
        }
        return add.call(this, type, fn, opt);
      };
    })();
    window.addEventListener('keydown', function (e) {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) e.preventDefault();
    });
    var Module = {
      canvas: document.getElementById('canvas'),
      setStatus: function (t) { var el = document.getElementById('status'); el.textContent = t; el.hidden = !t; },
      print: function (t) { console.log(t); },
      printErr: function (t) { console.error(t); }
    };
  </script>
  <script src="vendor/codemirror.js"></script>
  <script src="i18n.js"></script>
  <script src="sound.js"></script>
  <script src="leveledit.js"></script>
  <script src="app.js"></script>
  {{{ SCRIPT }}}
</body>
</html>
